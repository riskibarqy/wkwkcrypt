name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Fuzz parsers and codecs
        if: runner.os == 'Linux'
        run: |
          go test ./internal/codec -run=^$ -parallel=2 -fuzz=^FuzzDecode$ -fuzztime=30s
          go test ./internal/codec -run=^$ -parallel=2 -fuzz=^FuzzEncodeDecodeWords$ -fuzztime=30s
          go test ./internal/envelope -run=^$ -parallel=2 -fuzz=^FuzzParse$ -fuzztime=30s
          go test . -run=^$ -parallel=2 -fuzz=^FuzzDecryptWithKey$ -fuzztime=30s
