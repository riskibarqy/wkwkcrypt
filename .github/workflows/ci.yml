name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Fuzz parsers and codecs
        run: |
          go test ./internal/codec -run=^$ -fuzz=FuzzDecode -fuzztime=3s
          go test ./internal/codec -run=^$ -fuzz=FuzzEncodeDecodeWords -fuzztime=3s
          go test ./internal/envelope -run=^$ -fuzz=FuzzParse -fuzztime=3s
          go test . -run=^$ -fuzz=FuzzDecryptWithKey -fuzztime=3s
